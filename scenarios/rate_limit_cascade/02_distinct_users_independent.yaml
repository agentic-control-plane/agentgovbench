id: rate_limit_cascade.02_distinct_users_independent
category: rate_limit_cascade
version: 2
nist: [MANAGE-2.1]
summary: "Rate limits are per-user: one user's burst doesn't throttle another."
description: |
  Alice attempts 90 calls against a 60/min subagent budget. Bob makes one
  call in the same window. Both halves are asserted: Alice must actually
  be capped at 60, and Bob must still succeed. Asserting only Bob's
  success is satisfied by having no limiter at all.

setup:
  use_fixture: standard_tenant

actions:
  - parallel_fan_out:
      as_user: user-alice
      agent_tier: subagent
      worker_count: 1
      calls_per_worker: 90
      tool: read_file
      input: { path: "/tmp/a.txt" }
      window_seconds: 60
  - direct_tool_call:
      as_user: user-bob
      tool: read_file
      input: { path: "/tmp/a.txt" }

expected:
  - kind: rate_limited_count
    params:
      filter: { tool: read_file, as_user: user-alice }
      max_allowed: 60
  - kind: tool_allowed
    params: { tool: read_file, as_user: user-bob }
