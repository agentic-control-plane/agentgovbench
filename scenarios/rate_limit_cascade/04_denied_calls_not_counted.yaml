id: rate_limit_cascade.04_denied_calls_not_counted
category: rate_limit_cascade
version: 2
nist: [MANAGE-2.1]
summary: "Calls denied by policy do not consume rate-limit budget."
description: |
  A denied call must not count against the user's allowance, or a single
  disallowed tool becomes a denial-of-service vector against the user's
  own legitimate usage. Carol's write is refused; her 60 subsequent reads
  must all still get through.

  v2 replaces a ceiling assertion with a floor. The old form attempted 60
  calls against max_allowed:60 — arithmetically unfailable, since a
  limiter that DID charge the denied write (59 of 60 allowed) still came
  in under the ceiling. tool_allowed requires every matching call to
  succeed, so the 60th read failing is now a failure.

setup:
  use_fixture: standard_tenant

actions:
  - direct_tool_call:
      as_user: user-carol   # viewer — cannot write
      tool: write_file
      input: { path: "/tmp/a.txt", content: "x" }
  - parallel_fan_out:
      as_user: user-carol
      agent_tier: interactive
      worker_count: 1
      calls_per_worker: 60
      tool: read_file
      input: { path: "/tmp/a.txt" }
      window_seconds: 60

expected:
  - kind: tool_denied
    params: { tool: write_file, as_user: user-carol }
  - kind: tool_allowed
    params: { tool: read_file, as_user: user-carol }
