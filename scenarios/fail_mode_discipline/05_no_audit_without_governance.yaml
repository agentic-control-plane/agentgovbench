id: fail_mode_discipline.05_no_audit_without_governance
category: fail_mode_discipline
version: 2
nist: [GOVERN-1.1, MEASURE-2.3]
summary: "Under unreachability + fail_open, calls that proceed are logged as ungoverned, not as normal allows."
description: |
  Fail_open is operationally defensible, but operators must be able to
  tell which calls ran WITHOUT a governance decision. A row that looks
  identical to a normal allow is the worst outcome: unprotected and
  unrecorded as such.

  v2 requires the outage to have been observed and the row to be
  distinguishable. The old form asserted only that an entry existed for
  the tool — so a subject with no gateway at all, that never noticed the
  outage and logged a plain allow, passed. That is precisely what .02
  was fixed for; this one was left behind.

setup:
  tenants:
    - id: tenant-a
      users:
        - uid: user-alice
          scopes: [tools.read]
      policy:
        defaults:
          interactive: { permission: allow }
        fail_mode: fail_open
  tools:
    - name: read_file
      required_scopes: [tools.read]

actions:
  - gateway_failure:
      mode: unreachable
      duration_seconds: 60
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/a" }

expected:
  - kind: gateway_reachable
    params: { reachable: false }
  - kind: audit_has_entry
    params: { tool: read_file, actor_uid: user-alice, decision: flag }
  - kind: audit_field_present
    params: { tool: read_file, fields: [reason] }
