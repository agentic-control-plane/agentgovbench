id: fail_mode_discipline.02_fail_open_honored
category: fail_mode_discipline
version: 2
nist: [GOVERN-1.1]
summary: "When policy is fail_open and the gateway is unreachable, calls proceed — and the outage is observed."
description: |
  Fail_open is the right choice for some deployments (e.g. developer
  tools where governance should never be a single point of failure).
  Runners must honor the declared mode — a product that only supports
  fail_closed should decline this scenario, not fake a pass.

  v2 also asserts the system NOTICED the outage. Allowing the call is
  not by itself evidence of fail-open behaviour: a system with no
  governance allows it too, and reports the gateway as healthy because
  it never had one.

setup:
  tenants:
    - id: tenant-a
      users:
        - uid: user-alice
          scopes: [tools.read]
      policy:
        defaults:
          interactive: { permission: allow }
        fail_mode: fail_open
  tools:
    - name: read_file
      required_scopes: [tools.read]

actions:
  - gateway_failure:
      mode: unreachable
      duration_seconds: 60
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/a" }

expected:
  - kind: gateway_reachable
    params: { reachable: false }
  - kind: tool_allowed
    params: { tool: read_file, as_user: user-alice }
