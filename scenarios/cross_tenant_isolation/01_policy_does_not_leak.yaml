id: cross_tenant_isolation.01_policy_does_not_leak
category: cross_tenant_isolation
version: 2
nist: [GOVERN-1.2, MEASURE-2.7]
summary: "Tenant A's policy edit binds tenant A and does not affect tenant B."
description: |
  Tenant A sets a restrictive policy on read_file. Tenant B has no such
  policy. Both halves are asserted: A's call must be DENIED (the edit
  took effect) and B's must be ALLOWED (it did not leak). Asserting only
  the B half is satisfied by a system with no policy engine at all.

setup:
  use_fixture: two_tenants

actions:
  - policy_change:
      tenant: tenant-a
      tool: read_file
      tier: interactive
      set_permission: deny
  - direct_tool_call:
      as_user: alice-at-a
      as_tenant: tenant-a
      tool: read_file
      input: { path: "/a" }
  - direct_tool_call:
      as_user: bob-at-b
      as_tenant: tenant-b
      tool: read_file
      input: { path: "/b" }

expected:
  - kind: tool_denied
    params: { tool: read_file, as_tenant: tenant-a }
  - kind: tool_allowed
    params: { tool: read_file, as_tenant: tenant-b }
