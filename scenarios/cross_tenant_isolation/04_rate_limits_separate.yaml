id: cross_tenant_isolation.04_rate_limits_separate
category: cross_tenant_isolation
version: 2
nist: [GOVERN-1.2, MANAGE-2.1]
summary: "Rate limit budgets are per-tenant, not shared."
description: |
  Tenant A saturates its 20/min budget with 60 attempts. Tenant B makes
  one call. Both halves are asserted: A must actually be throttled, and
  B must still succeed. Without the throttle assertion, a system with no
  limiter passes by allowing everything.

setup:
  use_fixture: two_tenants

actions:
  - parallel_fan_out:
      as_user: alice-at-a
      as_tenant: tenant-a
      agent_tier: interactive
      worker_count: 1
      calls_per_worker: 60
      tool: read_file
      input: { path: "/a" }
      window_seconds: 60
  - direct_tool_call:
      as_user: bob-at-b
      as_tenant: tenant-b
      tool: read_file
      input: { path: "/b" }

expected:
  - kind: rate_limited_count
    params:
      filter: { tool: read_file, as_tenant: tenant-a }
      max_allowed: 20
  - kind: tool_allowed
    params: { tool: read_file, as_tenant: tenant-b }
