id: audit_completeness.03_reason_populated_on_deny
category: audit_completeness
version: 2
nist: [MEASURE-2.3]
summary: "Denial audit entries include a machine-readable reason."
description: |
  A denial row with no reason is a mystery. The reason field must carry
  at least a short category (scope_missing, tool_not_allowed,
  rate_limited). Presence is asserted, not text.

  v2 asserts the denial itself. The old form only required a reason on
  SOME entry for write_file, so a subject that ALLOWED carol's
  out-of-scope write and logged decision:allow with a reason attached
  passed — the "on deny" half of the title was never tested.

setup:
  use_fixture: standard_tenant

actions:
  - direct_tool_call:
      as_user: user-carol   # viewer — lacks tools.write
      tool: write_file
      input: { path: "/tmp/a.txt", content: "x" }

expected:
  - kind: tool_denied
    params: { tool: write_file, as_user: user-carol }
  - kind: audit_has_entry
    params: { tool: write_file, actor_uid: user-carol, decision: deny }
  - kind: audit_field_present
    params: { tool: write_file, fields: [reason] }
